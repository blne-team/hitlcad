name: CI
on:
  push:
  pull_request:
  workflow_call: # release.yml runs these checks before it publishes

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run lint-imports # hitlcad's own plugins and the rest import each other only one way

  backend:
    name: backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every test, on the Python a release installs by default (.python-version)
          - { os: ubuntu-latest, python: "3.11", workers: 4, tests: "" }
          # Windows and macOS: every test but the exhaustive cases Linux runs once
          - { os: windows-latest, python: "3.11", workers: 4, tests: '-m "not once"' }
          - { os: macos-latest, python: "3.11", workers: 2, tests: '-m "not once"' } # 7 GB: two builds at a time
          # The other Pythons: the tests that build no geometry, and one build
          - { os: ubuntu-latest, python: "3.12", workers: 4, tests: '-m "not geometry or smoke"' }
          - { os: ubuntu-latest, python: "3.13", workers: 4, tests: '-m "not geometry or smoke"' }
    env:
      UV_PYTHON: ${{ matrix.python }} # every uv command below, not only the first, runs on this Python
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/blender
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run hitlcad doctor
      - run: uv run pytest -n ${{ matrix.workers }} ${{ matrix.tests }}

  extension:
    name: extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'Linux'
        with:
          enable-cache: true
      - name: Panel UI's API types match the server's models
        if: runner.os == 'Linux'
        run: |
          npm run api-types
          git diff --exit-code -- src/lib/schema.ts || { echo "::error::run scripts/api-types.sh and commit src/lib/schema.ts"; exit 1; }
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm test
      - run: npm run package
        if: runner.os == 'Linux'

  e2e:
    name: end-to-end (server, panel UI, extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/blender
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            vscode-extension/package-lock.json
            e2e/package-lock.json
      - name: Compile the extension and build the panel UI
        run: npm --prefix vscode-extension ci && npm --prefix vscode-extension run compile
      - name: Install the end-to-end tests and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: npm run typecheck
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results

  package:
    name: release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/

  install:
    name: install the release (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      HITLCAD_BACKENDS: '["build123d"]' # no Blender here: the installed tool on its own
    steps:
      - uses: actions/checkout@v4 # the examples, and the VS Code version to install
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/vscode
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Unpack the release
        shell: bash
        run: mkdir unpacked && tar -xzf dist/hitlcad-*.tar.gz -C unpacked
      - name: Run install.sh
        if: runner.os != 'Windows'
        run: cd unpacked/hitlcad-*/ && ./install.sh
      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location (Get-ChildItem -Directory unpacked\hitlcad-*)
          powershell -ExecutionPolicy Bypass -File install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: uv tool dir --bin >> "$GITHUB_PATH"
        shell: bash
      - name: The extension is installed
        shell: pwsh # each platform's own code launcher (code.cmd on Windows)
        run: if ((code --list-extensions) -notcontains "hitlcad-local.hitlcad") { exit 1 }
      - run: hitlcad build examples/handhold-fan --out build-out --no-render
