name: CI
on:
  push:
  pull_request:
  workflow_call: # release.yml runs these checks before it publishes

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend

  backend:
    name: backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # Blender builds the Blender backend's designs and renders every preview; same version as the devcontainer.
      - name: Blender version
        id: blender
        run: echo "version=$(sed -n 's/^ARG BLENDER_VERSION="\(.*\)"/\1/p' .devcontainer/Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: Blender's system libraries (software OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libgl1 libegl1 libgl1-mesa-dri libglu1-mesa \
            libxi6 libxkbcommon0 libxxf86vm1 libxrender1 libxfixes3 libsm6 libxrandr2 libxinerama1 libxcursor1 libx11-xcb1
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: ~/blender
          key: blender-${{ steps.blender.outputs.version }}-linux-x64
      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          v="${{ steps.blender.outputs.version }}"
          mkdir -p ~/blender
          curl --fail --location --silent --show-error "https://download.blender.org/release/Blender${v%.*}/blender-$v-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1
      - run: echo "$HOME/blender" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run hitlcad doctor
      - run: uv run pytest

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Panel UI's API types match the server's models
        run: |
          npm run api-types
          git diff --exit-code -- ui/src/api/schema.ts || { echo "::error::run scripts/api-types.sh and commit ui/src/api/schema.ts"; exit 1; }
      - run: npm test
      - run: npm run package

  e2e:
    name: end-to-end (server, panel UI, extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            vscode-extension/package-lock.json
            e2e/package-lock.json
      - name: Compile the extension and build the panel UI
        run: npm --prefix vscode-extension ci && npm --prefix vscode-extension run compile
      - name: Install the end-to-end tests and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: npm run typecheck
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
