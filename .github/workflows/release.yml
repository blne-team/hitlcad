name: Release
# Push a tag matching the version in pyproject.toml and vscode-extension/package.json, e.g.
#   git tag v0.2.0 && git push origin v0.2.0
# CI builds the release (scripts/package.sh) and installs it on Linux, macOS and Windows; once it passes, this
# publishes that same package as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the version
        run: |
          version="$(uv version --short)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "hitlcad $VERSION" --generate-notes \
            "dist/hitlcad-$VERSION.tar.gz" \
            "dist/hitlcad-$VERSION/hitlcad-$VERSION-py3-none-any.whl" \
            "dist/hitlcad-$VERSION/hitlcad-$VERSION.vsix"
