[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hitlcad"
version = "0.1.2"
description = "Parametric CAD for coding agents: build123d and Blender designs reviewed in VS Code"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "watchfiles>=1.0",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "mcp>=2.3,<3",
  "build123d>=0.11",
  "trimesh>=4.5",
  "rtree>=1.3",  # trimesh needs it for closest-point queries (describing mesh picks, carrying pins)
  "numpy>=1.26",
  "pillow>=11",
  "manifold3d>=3",
  "libigl>=2.6.3",  # an AABB tree for rays and nearest points, in C++: wall thickness, overhang and undercut checks
  "scipy>=1.13",  # nearest samples, convex hulls and connected regions for the manufacturing checks
  "networkx>=3",  # the loops of mates motion finds; trimesh needs it to measure meshes that are not closed
  "tomlkit>=0.15.1",
  "bd-warehouse>=0.4.0",  # the standard-parts catalog provider: ISO/ASME fasteners, inserts, bearings
  "lxml>=6.1.3",  # trimesh needs it to read 3MF (the file viewer)
  # writes 3MF with colours (the 3MF Consortium's library; build123d uses it too, as py-lib3mf on Linux ARM)
  "lib3mf>=2.5.0; sys_platform != 'linux' or platform_machine != 'aarch64'",
  "py-lib3mf>=2.5.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "psutil>=7",  # a build's memory, measured the same way on every platform
  "pywin32>=311; sys_platform == 'win32'",  # job objects: a build ends with everything it started
  "pluggy>=1.5",  # plugins: hitlcad's own vocabulary, backends and outputs, and any installed
  "packaging>=24",  # the version specifiers a design.json names its plugins with
  "filelock>=3.16",  # one server to a data folder: it holds the folder's lock while it runs
  "opencv-python-headless>=4.10",  # cuts the subject of a reference picture out of its background (GrabCut)
  "python-fcl>=0.7",  # distances between solids, each moved, from a tree of its triangles built once: motion sweeps
  "casadi>=3.8.1",
  "pycrdt>=0.12",
  "diff-match-patch>=20230430",
  "tree-sitter>=0.23",
  "tree-sitter-json>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "httpx>=0.28",
    "ruff>=0.11",
    "pytest-xdist>=3",  # the tests in parallel: most of their time is builds and analyses of one design each
    "hitlcad-lasercut",  # the example plugin (examples/plugins), installed so its tests run
    "import-linter>=2.1",  # the layers: hitlcad's own plugins and the rest import each other only one way
]

[project.scripts]
hitlcad = "hitlcad.cli:run"

# hitlcad's own plugins, registered as any other is: a design's vocabulary, the backends, catalogs, exporters
# and materials (backend/hitlcad/kernel/plugins.py)
[project.entry-points."hitlcad.plugins"]
joints = "hitlcad.builtin.joints"
gears = "hitlcad.builtin.gears"
cams = "hitlcad.builtin.cams"
checks = "hitlcad.builtin.checks"
processes = "hitlcad.builtin.processes"
build123d = "hitlcad.builtin.build123d"
blender = "hitlcad.builtin.blender"
catalogs = "hitlcad.builtin.catalogs"
exports = "hitlcad.builtin.exports"
robot = "hitlcad.builtin.robot"
solvers = "hitlcad.builtin.solvers"
materials = "hitlcad.builtin.materials"
pictures = "hitlcad.builtin.pictures"

[tool.hatch.build.targets.wheel]
packages = ["backend/hitlcad"]

[tool.uv]
# Supply-chain cooldown: only resolve releases that have been public for two weeks.
exclude-newer = "2026-10-08T00:00:00Z"

[tool.uv.workspace]
# A plugin outside hitlcad, as a worked example: the tests check it shows up without a change to hitlcad.
members = ["examples/plugins/hitlcad-lasercut"]

[tool.uv.sources]
hitlcad-lasercut = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
# PLW1514: text files name their encoding, so nothing depends on the process's locale (lib3mf changes it)
select = ["E", "F", "I", "B", "UP", "SIM", "PLW1514"]
preview = true
explicit-preview-rules = true
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
# One event loop per test process: the session's backends keep their workers on it from test to test (conftest)
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# In parallel: a worker per physical core, at most 6. Each test builds and measures with several threads and
# processes of its own, so more workers wait on each other; and a worker peaks at about 4 GB, 6 at about 12 GB.
# --pdb runs the tests in this process; so does -n0.
addopts = "-n auto --maxprocesses=6 --dist worksteal"
markers = [
  "geometry: builds or measures geometry, with build123d and Blender",
  "examples: builds installed teaching designs or README examples in every configuration",
  "smoke: one build, run where the geometry tests are not",
  "once: an exhaustive case: CI runs it on one job",
  "cold_cache: builds with a part cache of its own, empty at the start (the test is about caching)",
]
# A numeric warning (a division by zero, an invalid value) is a NaN on its way into a report: fail on it
filterwarnings = ["error::RuntimeWarning"]

# The layers, and hitlcad's own plugins apart from them: `uv run lint-imports` checks both. Each package imports only
# those below it; packages on one line import neither each other.
[tool.importlinter]
root_packages = ["hitlcad"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Each layer imports only those below it"
type = "layers"
layers = [
  "hitlcad.cli",
  "hitlcad.api",
  "hitlcad.app",
  "hitlcad.services",
  "hitlcad.workspace | hitlcad.store",
  "hitlcad.build",
  "hitlcad.agent | hitlcad.review | hitlcad.render",
  "hitlcad.analysis",
  "hitlcad.geometry | hitlcad.backends | hitlcad.exporters",
  "hitlcad.execution",
  "hitlcad.config",
  "hitlcad.core | hitlcad.catalogs | hitlcad.materials",
  "hitlcad.kernel | hitlcad.sdk",
]

[[tool.importlinter.contracts]]
name = "hitlcad knows its own plugins only as it knows any: through the registry"
type = "forbidden"
source_modules = [
  "hitlcad.kernel", "hitlcad.core", "hitlcad.config", "hitlcad.execution", "hitlcad.geometry", "hitlcad.backends",
  "hitlcad.exporters", "hitlcad.catalogs", "hitlcad.materials", "hitlcad.analysis", "hitlcad.agent", "hitlcad.review",
  "hitlcad.render", "hitlcad.build", "hitlcad.workspace", "hitlcad.store", "hitlcad.services", "hitlcad.app",
  "hitlcad.api", "hitlcad.cli", "hitlcad.sdk",
]
forbidden_modules = ["hitlcad.builtin"]

[[tool.importlinter.contracts]]
name = "Plugins build on the domain and the measuring toolkit, not on the services and surfaces"
type = "forbidden"
source_modules = ["hitlcad.builtin"]
forbidden_modules = [
  "hitlcad.services", "hitlcad.api", "hitlcad.store", "hitlcad.workspace", "hitlcad.agent", "hitlcad.review",
  "hitlcad.app", "hitlcad.cli", "hitlcad.build.pipeline",
]
