[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hitlcad"
version = "0.1.0"
description = "Parametric CAD for coding agents: build123d and Blender designs reviewed in VS Code"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "watchfiles>=1.0",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "mcp>=2.3,<3",
  "build123d>=0.11",
  "trimesh>=4.5",
  "rtree>=1.3",  # trimesh needs it for closest-point queries (describing mesh picks, carrying pins)
  "numpy>=1.26",
  "pillow>=11",
  "ocp-tessellate>=3.5,<3.6",  # output format of three-cad-viewer 5.0.x (vscode-extension/ui); upgrade the two together
  "manifold3d>=3",
  # rays and nearest points on a mesh through its AABB tree, in C++: wall thickness, overhang and undercut checks
  "libigl>=2.6.3",
  "scipy>=1.13",  # nearest samples, convex hulls and connected regions for the manufacturing checks
  "networkx>=3",  # trimesh needs it to measure meshes that are not closed
  "tomlkit>=0.15.1",
  "bd-warehouse>=0.4.0",  # the standard-parts catalog provider: ISO/ASME fasteners, inserts, bearings
  "isofits>=1.0",  # ISO 286 tolerance tables for fits
  "lxml>=6.1.3",  # trimesh needs it to read 3MF (the file viewer)
  # writes 3MF with colours (the 3MF Consortium's library; build123d uses it too, as py-lib3mf on Linux ARM)
  "lib3mf>=2.5.0; sys_platform != 'linux' or platform_machine != 'aarch64'",
  "py-lib3mf>=2.5.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "psutil>=7",  # a build's memory, measured the same way on every platform
  "pywin32>=311; sys_platform == 'win32'",  # job objects: a build ends with everything it started
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "httpx>=0.28",
    "ruff>=0.11",
]

[project.scripts]
hitlcad = "hitlcad.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["backend/hitlcad"]

[tool.uv]
# Supply-chain cooldown: only resolve releases that have been public for two weeks.
exclude-newer = "2026-10-08T00:00:00Z"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
# PLW1514: text files name their encoding, so nothing depends on the process's locale (lib3mf changes it)
select = ["E", "F", "I", "B", "UP", "SIM", "PLW1514"]
preview = true
explicit-preview-rules = true
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = ["geometry: needs build123d and Blender"]
# A numeric warning (a division by zero, an invalid value) is a NaN on its way into a report: fail on it
filterwarnings = ["error::RuntimeWarning"]
